name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 -m pytest -q

  # Kept under the old name so the merge rule that requires "harness" still finds it.
  # It now checks the content: every chapter, sketch, wiring drawing and bench experiment
  # is present and matches the printed book, and the sealed faults never reach Milo.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 -m pytest -q tests/test_content.py tests/test_evals.py --tb=short
