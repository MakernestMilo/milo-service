name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 -m pytest -q
      - name: QC harness
        run: python3 -m pytest -q tests/test_qc.py --tb=short
      - name: Harness count
        run: python3 -c "import qc, tests.fixtures.fake_runtime as f; rows = qc.run(f.level, f.assemble); assert len(rows) == 5712, len(rows)"

