name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python3 -m pytest -q

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: QC harness
        run: python3 -m pytest -q tests/test_qc.py --tb=short
      # The count is asserted in a job of its own. A truncated ci.yml removes
      # this job entirely, so the required check never reports and the merge
      # blocks — rather than a hollow job passing in its place.
      - name: Harness count
        run: python3 -c "import qc, runtime as r, assembler as a; rows = qc.run(r.level, a.assemble); assert len(rows) == 5712, len(rows)"
