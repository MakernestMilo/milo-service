<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#191713">
<meta name="robots" content="noindex, nofollow">
<title>Milo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--ink:#191713;--ac:#BF532D;--sd:#E3CFA6;--pa:#F8F2E4;--mu:#5f594f;--ln:#d6ccb8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--pa);color:var(--ink);
  font-family:'Newsreader',Georgia,serif;
  display:flex;flex-direction:column;
  height:100dvh;overscroll-behavior:none}

/* the chapter — AZ. It confirms the scan worked. */
.hd{padding:16px 20px 13px;background:var(--sd);flex:none}
.hd .k{font:700 9px/1 'Space Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#7a4a22;margin-bottom:8px}
.hd h1{font:600 29px/1.05 'Hanken Grotesk',system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 5px;text-wrap:balance}
.hd .sub{font:400 15px/1.35 'Newsreader',Georgia,serif;font-style:italic;color:#3d382f;margin:0 0 12px}
.hd .met{display:flex;gap:18px;font:700 8px/1.4 'Space Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#7a4a22}
.hd .met b{display:block;font:400 13px/1.3 'Newsreader',Georgia,serif;color:var(--ink);letter-spacing:0;text-transform:none}

.dock{border-top:2px solid var(--ink);background:#fff;flex:1;display:flex;flex-direction:column;min-height:0}
.dock .dh{padding:9px 16px;background:var(--ink);color:var(--sd);
  font:700 8.5px/1 'Space Mono',monospace;letter-spacing:.16em;text-transform:uppercase;flex:none}
.log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px;
  display:flex;flex-direction:column}
/* The dock fills the viewport here, where in the beta it sat under a page of
   build instructions. An empty log would otherwise open as a tall white void.
   margin-top on the first child rather than justify-content:flex-end, which
   makes overflow unreachable at the top once the conversation is long. */
.log > :first-child{margin-top:auto}
.msg{margin-bottom:11px;font:400 15px/1.5 'Newsreader',Georgia,serif}
.msg.me{text-align:right;color:var(--mu)}
.msg.me span{display:inline-block;background:#f1ece0;border-radius:12px 12px 3px 12px;padding:7px 11px;max-width:82%;text-align:left;color:#3d382f;white-space:pre-wrap}
.msg.milo span{display:inline-block;background:var(--sd);border-radius:12px 12px 12px 3px;padding:8px 12px;max-width:88%;color:var(--ink);white-space:pre-wrap}
.msg.sys{font:700 8px/1.5 'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#6f675b;text-align:center}

.quick{display:flex;gap:5px;padding:8px 12px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;white-space:nowrap;border:1px solid var(--ln);background:#fffdf8;color:var(--mu);
  border-radius:20px;padding:7px 12px;font:700 8px/1 'Space Mono',monospace;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer}
.quick button:active{border-color:var(--ink);color:var(--ink)}

.asklabel{padding:9px 12px 0;font:700 8px/1 'Space Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6f675b;flex:none}
.ask{display:flex;gap:7px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--ln);background:var(--pa);flex:none;margin:0}
.ask input{flex:1;min-width:0;background:#fff;border:2px solid #8a8172;border-radius:9px;padding:11px 12px;
  font:400 16px/1.2 'Newsreader',Georgia,serif;color:var(--ink);caret-color:var(--ac);outline:none}
.ask input::placeholder{color:#6f675b}
.ask input:focus{border-color:var(--ink)}
.ask button{border:none;background:var(--ink);color:var(--pa);border-radius:9px;padding:0 16px;
  font:700 9px/1 'Space Mono',monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.ask button[disabled],.quick button[disabled]{opacity:.45}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>

<div class="hd">
  <div class="k">Build __KEY__ · __RUNG__</div>
  <h1>__NAME__</h1>
  <p class="sub">__SUB__</p>
  <div class="met"><span>Time<b>__TIME__</b></span><span>Open<b>__OPEN__</b></span></div>
</div>

<div class="dock">
  <!-- AZ and C-33: the rung is not here, and is not anywhere in this document. -->
  <div class="dh">Milo</div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <div class="asklabel">Your turn — type here</div>
  <form class="ask" id="ask" autocomplete="off">
    <input id="in" placeholder="Type to Milo" autocomplete="off" autocapitalize="sentences"
           autocorrect="on" enterkeyhint="send" maxlength="600" aria-label="Type to Milo">
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
"use strict";
// The chapter is carried by the URL, which is carried by the card in the
// child's hand — AY. It is not a thing this page decides or a child can pick.
var CHAPTER = "__KEY__";
var QUICK = __QUICK__;

var log = document.getElementById("log"),
    input = document.getElementById("in"),
    send = document.getElementById("send"),
    form = document.getElementById("ask"),
    quick = document.getElementById("quick"),
    busy = false;

// One session per chapter, kept across the tab closing — V3. A store that
// throws (private mode, blocked site data) must not cost the child the page,
// so every read and write of it is guarded and the fallback is a session that
// simply does not survive the tab.
var sid = null;
function sessionId(){
  if (sid) return sid;
  var k = "milo:session:" + CHAPTER;
  try { sid = localStorage.getItem(k); } catch (e) {}
  if (!sid) {
    sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : String(Date.now()) + "-" + Math.random().toString(36).slice(2);
    try { localStorage.setItem(k, sid); } catch (e) {}
  }
  return sid;
}

function addMsg(who, text){
  var d = document.createElement("div");
  d.className = "msg " + who;
  if (who === "sys") { d.textContent = text; }
  else { var s = document.createElement("span"); s.textContent = text; d.appendChild(s); }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function setBusy(state){
  busy = state;
  send.disabled = state;
  var b = quick.querySelectorAll("button");
  for (var i = 0; i < b.length; i++) b[i].disabled = state;
}

async function ask(text){
  if (busy || !text.trim()) return;
  setBusy(true);
  addMsg("me", text);
  var thinking = addMsg("sys", "Milo is looking…");
  try {
    var r = await fetch("/turn", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session: sessionId(), chapter: CHAPTER, message: text})
    });
    if (!r.ok) throw new Error(String(r.status));
    var out = await r.json();
    thinking.remove();
    // out.level is on the wire because the instruments read it. It is not
    // rendered, and no branch here reads it.
    addMsg("milo", String(out.reply || "").trim());
  } catch (e) {
    thinking.remove();
    addMsg("sys", "offline");
  }
  setBusy(false);
  input.focus();
}

form.addEventListener("submit", function(e){
  e.preventDefault();
  var t = input.value;
  input.value = "";
  ask(t);
});

// The dock's probes, for a child who cannot phrase it. Label and question are
// both authored; this only wires them up.
QUICK.forEach(function(q){
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = q.label;
  b.addEventListener("click", function(){ ask(q.says); });
  quick.appendChild(b);
});
</script>
</body></html>
